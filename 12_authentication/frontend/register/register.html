<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Page</title>
    <link rel="stylesheet" href="register.css">
</head>
<body>
    <div class="div-container">
        <form id="signupForm">
            <div class="container">
            <h1>Sign Up</h1>
                <p>Please fill in this form to create an account.</p>
            <hr>
            <label for="fname" ><b>First Name</b></label>
            <input type="text" id="fname" placeholder="Enter First Name" name="fname" required>

            <label for="lname" ><b>Last Name</b></label>
            <input type="text" id="lname" placeholder="Enter Lase Name" name="lname" required>

            <label for="email" ><b>Email</b></label>
            <input type="email"  id="email" placeholder="Enter Email" name="email" required>

            <label for="uname" ><b>Username</b></label>
            <input type="text" id="uname" placeholder="Enter Username" name="uname" required>

            <label for="psw" ><b>Password</b></label>
            <input type="password" id="psw" placeholder="Enter Password" name="psw" required>

            <button type="submit">Login</button>

            <div class="bottom-div">
                <span>Already have an  <a href="../login/login.html">account?</a></span>
            </div>
        </div>
    </form>
    </div>
</body>
</html>
